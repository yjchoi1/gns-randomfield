defaults:
  - _self_
  - override hydra/hydra_logging: disabled  
  - override hydra/job_logging: disabled  

hydra:
  output_subdir: null  
  run:
    dir: .

# Top level config
n_dims: 2
domain: [[0.0, 480.0], [0.0, 120]]
n_material_props: 2
max_cohesion: 100000
sim_id_range: [0, 100]
full_mpm_interval: 1
save_dir: /scratch1/08264/baagee/gns-randomfield/case-4/

# MPM config
mpm_config:
  input_generator_module_name: genenrate_input_case4
  dt: 1e-04
  initial_position_length: 6
  n_full_mpm_timesteps: 225000
  n_first_initial_timesteps: 2251
  output_steps: 375

# GNS config
gns_config:
  rigid_material_param: [1.0, 1.0]
  cohesion_scaling_factor: 1e5
  kinematic_particle: 6
  stationary_particle: 3
  num_particle_types: 9
  noise_std: 6.7e-2
  data_path: /work/08264/baagee/frontera/gns-randomfield/data/gns/sand2d-landslide2-r60-fix-mp-base-c/
  model_path: /work/08264/baagee/frontera/gns-randomfield/data/gns/sand2d-landslide2-r60-fix-mp-base-c/
  meta_data: metadata-r60.json
  model_file: model-4800000.pt
  nsteps: 594
  physical_dt: 0.0375






